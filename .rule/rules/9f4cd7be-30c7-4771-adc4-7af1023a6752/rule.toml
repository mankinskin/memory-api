title = "<x>-api crate owns the model"
state = "draft"
body = "# <x>-api crate owns the model\n\nFor each store domain (`ticket-api`, `spec-api`, `rule-api`, `doc-api`, `audit-api`, `mem-api`), the `<x>-api` crate owns the canonical model: entity types, store traits, validation, indexing, history, and the in-process API. CLI, MCP, and HTTP tools are thin adapters that translate transport into `<x>-api` calls."
