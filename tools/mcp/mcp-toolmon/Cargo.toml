[package]
name = "mcp-toolmon"
version = "0.1.0"
edition = "2024"
description = "Model-aware MCP middleware: requires a per-request caller_model and enforces the price-awareness orchestrator threshold at the tool boundary"

[[bin]]
name = "mcp-toolmon"
path = "src/main.rs"

[lib]
name = "mcp_cost_gate"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[dev-dependencies]
tempfile = "3"
