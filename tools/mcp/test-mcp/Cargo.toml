[package]
name = "test-mcp"
version = "0.1.0"
edition = "2024"
description = "MCP server for test-api with direct store access"

[[bin]]
name = "test-mcp"
path = "src/main.rs"

[lib]
name = "test_mcp"
path = "src/lib.rs"

[dependencies]
test-api = { path = "../../../crates/test-api" }
memory-kernel = { git = "https://github.com/mankinskin/memory-kernel", branch = "main"  }
chrono = { version = "0.4", features = ["serde"] }
rmcp = { version = "0.14", features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
