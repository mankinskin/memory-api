[package]
name = "fs-mcp"
version = "0.1.0"
edition = "2024"
description = "MCP server exposing bounded filesystem operations with conflict-aware mutations"

[[bin]]
name = "fs-mcp"
path = "src/main.rs"

[lib]
name = "fs_mcp"
path = "src/lib.rs"

[dependencies]
fs-api = { path = "../../../crates/fs-api" }
rmcp = { version = "0.14", features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

[dev-dependencies]
tempfile = "3"
