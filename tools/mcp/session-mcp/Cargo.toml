[package]
name = "session-mcp"
version = "0.1.0"
edition = "2024"
description = "MCP server for session-api with direct store access"

[[bin]]
name = "session-mcp"
path = "src/main.rs"

[lib]
name = "session_mcp"
path = "src/lib.rs"

[dependencies]
session-api = { path = "../../../crates/session-api" }
memory-api = { path = "../../../crates/memory-api" }

chrono = { version = "0.4", features = ["serde"] }
rmcp = { version = "0.14", features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3"
chrono = { version = "0.4", features = ["serde"] }
rule-api = { path = "../../../crates/rule-api" }
