[package]
name = "rule-mcp"
version = "0.1.0"
edition = "2024"
description = "MCP server for rule-api with direct store access"

[[bin]]
name = "rule-mcp"
path = "src/main.rs"

[lib]
name = "rule_mcp"
path = "src/lib.rs"

[dependencies]
rule-api = { path = "../../../crates/rule-api" }
memory-api = { path = "../../../crates/memory-api" }
spec-api = { path = "../../../crates/spec-api" }

rmcp = { version = "0.14", features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"