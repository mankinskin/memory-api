[package]
name = "rule-mcp"
version = "0.1.0"
edition = "2024"
description = "MCP server for rule-api with direct store access"

[[bin]]
name = "rule-mcp"
path = "src/main.rs"

[lib]
name = "rule_mcp"
path = "src/lib.rs"

[dependencies]
rule-api = { path = "../../../crates/rule-api" }
memory-kernel = { git = "https://github.com/mankinskin/memory-kernel", branch = "main"  }
spec-api = { git = "https://github.com/mankinskin/spec", branch = "main" }
rmcp = { version = "0.14", features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3"