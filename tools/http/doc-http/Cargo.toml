[package]
name = "doc-http"
version = "0.1.0"
edition = "2024"
description = "HTTP REST API for doc-api cargo doc artifact discovery"

[[bin]]
name = "doc-http"
path = "src/main.rs"

[lib]
name = "doc_http"
path = "src/lib.rs"

[dependencies]
doc-api = { path = "../../../crates/doc-api" }
memory-api = { path = "../../../crates/memory-api" }

axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tower-http = { version = "0.6", features = ["cors"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
