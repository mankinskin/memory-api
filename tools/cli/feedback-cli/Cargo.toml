[package]
name = "feedback-cli"
version = "0.1.0"
edition = "2024"
description = "CLI for feedback-api: ingest, inbox query, summary, and transcript mining"

[[bin]]
name = "feedback"
path = "src/main.rs"

[dependencies]
feedback-api = { path = "../../../crates/feedback-api" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
