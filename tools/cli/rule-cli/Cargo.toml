[package]
name = "rule-cli"
version = "0.1.0"
edition = "2024"
description = "CLI interface for rule-api: the `rule` command"

[[bin]]
name = "rule"
path = "src/bin/rule.rs"

[lib]
name = "rule_cli"
path = "src/lib.rs"

[dependencies]
rule-api = { path = "../../../crates/rule-api" }
memory-kernel = { git = "https://github.com/mankinskin/memory-kernel", branch = "main"  }
feedback-api = { path = "../../../crates/feedback-api" }
ticket-api = { git = "https://github.com/mankinskin/ticket", branch = "main"  }
spec-api = { git = "https://github.com/mankinskin/spec", branch = "main"  }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
toon-format = "0.5"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
memory-fixtures = { path = "../../../crates/memory-fixtures" }
tempfile = "3"