validation_summary = "Added third perf slice: internal store profiling now records open_or_init and scan sub-phases, plus 1, 10, and 100 change incremental scan coverage. New evidence from the large health fixture: open_or_init_total_ms was about 19535 and split almost evenly between bootstrap_scan_manifest_bootstrap_ms about 9779 and post_init_scan_ms about 9721, indicating a near double-scan on bootstrap. scan(true) took about 9579 ms and was dominated by integrate_root_0_tickets_ms about 7799 and rebuild_workflow_facts_ms about 1749, while scan_root_0_tickets_ms was only about 13. Incremental scan(false) remained dominated by integration and workflow recompute rather than directory walking: 1 change about 11115 ms, 10 changes about 11351 ms, and 100 changes about 20314 ms, with scan_root staying about 12 to 24 ms. Together with the earlier move timings, this points to index integration, workflow fact rebuild, and repeated bootstrap scans as the main slow paths rather than filesystem discovery."
