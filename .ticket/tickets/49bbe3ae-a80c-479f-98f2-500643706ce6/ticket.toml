validation_summary = "Added second perf slice: dedicated open_or_init/scan benches, move phase timings in journals, heavier fixture presets, and sequential heavy move coverage. New evidence: sequential heavy moves took about 27.8s and 28.0s with phase timings dominated by scan_target_ms about 22.3s and scan_source_ms about 5.3s; rename/rewrite/validate were negligible in that case. Criterion also reported open_or_init_root_perf_fixture is extremely slow, projecting about 376s for 10 samples, which strongly suggests store bootstrap/open is another major bottleneck alongside scan work."
