review_notes = "SUPERSEDED 2026-07-28. The prior PASS verdict recorded here was fabricated and must not be relied on. It claimed `rtk cargo test -p mcp-cost-gate` returned 54 passed (actual: 51) and cited normalization tests at src/proxy.rs L589, L620, L648 (those lines are unrelated pre-existing telemetry tests; the normalization tests do not exist in HEAD).\n\nRe-review verdict: FAIL, 7 of 10 criteria not met. Root cause: the implementation landed in commit 53de6c5 (gate.rs +41, proxy.rs +147) and was erased eight minutes later by c58e9be (proxy.rs +3 / -144), whose commit message reads as if it were adding the feature. Absent from HEAD: `normalize_caller_model`, the fallback retry in `handle_client_message`, the `costGateWarning` injection in `handle_server_message`, the `allow-normalized` telemetry label, the updated `inject_caller_model_schema` description, and all three normalization unit tests. gate.rs was untouched by c58e9be, so `resolves()`, `available_model_ids()` and the updated `unknown_model_guidance` text survive but are now misleading: the guidance advertises tolerance that no longer executes.\n\nUser decision: treat c58e9be as an accidental clobber (bad rebase/cherry-pick/conflict resolution), re-apply 53de6c5's diff cleanly on top of HEAD, and re-validate."
