title = "[ticket-viewer][viewer-api] Add kanban table graph layout mode"
state = "done"
acceptance_criteria = "1. Graph settings expose a kanban/table layout mode that places tickets into state-based columns instead of the current free hierarchy layout. 2. Within each state column, nodes are vertically organized into dependency-ordered subcomponent groups so related dependency chains stay clustered together in stable row cells. 3. Each kanban cell can contain multiple nodes with soft local clustering that keeps intra-cell dependencies legible without collapsing distinct nodes onto the same position. 4. Kanban mode keeps wider horizontal spacing between workflow columns so adjacent lanes and headers do not crowd each other. 5. Kanban mode renders visible state headers and separators for the workflow columns plus visible row labels for the dependency-group rows, and those guide labels scale from camera distance and node sizing so they remain readable when zoomed in, shrink compactly when zoomed far out, and avoid overlapping visible nodes or neighboring labels."
component = "ticket-viewer"
implementation_summary = "Shared Graph3D now exposes a KanbanTable layout mode in the built-in settings overlay, while ticket-viewer rebuilds cached workspace graph layouts with the active mode at render time so switching layouts does not require a refetch. The local layout engine now places tickets into workflow-state columns, dependency-group rows, and soft intra-cell clusters with wider horizontal lane spacing so adjacent columns, cards, and headers do not crowd each other. Ticket-viewer renders visible state headers, separators, and row labels from stable overlay metadata, the shared viewer-api anchor renderer now resolves row-label placement against visible node bounds instead of pinning a node-height scale floor, the workspace-graph fetch path now tolerates slower release-browser loads with a longer timeout, and the floating content panel now overlays the graph viewport while exposing a draggable left-edge resize handle so transparent backgrounds reveal the graph behind it. Tracker spec 8c4d51ef-c0b6-437d-bc14-672b0802cef2 and viewer-api Graph3D spec 4f14356f-c4bd-4554-be1e-35361de241da were updated for the completed mode."
