acceptance_criteria = "1. memory-api exposes one shared resolver that maps an explicit workspace root, store root, or path inside a store to the canonical hidden store root for ticket, spec, and rule workspaces. 2. ticket-cli, spec-cli, and rule-cli expose consistent global store-selection options, with one reserved spelling for targeting a workspace root and no duplicate or conflicting meanings for that same option name. 3. spec refs validate works from the context-engine repo root against the nested memory-api spec store without requiring duplicate workspace-root flags, and its file-resolution option uses a distinct, unambiguous name. 4. Focused automated tests cover nested root selection for ticket, spec, and rule CLIs plus the spec refs validation path, and the shared workspace spec is updated to document the cross-link and option-naming contract."
