validation_summary = "Authoritative evidence: exec-val-session-workflow-finish-remediation-20260714 under val-session-workflow-finish. Windows results: cargo test -p session-api passed 106 tests; cargo test -p session-api -p session-cli -p session-mcp passed 124 tests; cargo fmt --check -p session-api passed. Focused regressions passed for aged live lock exclusion/ownership-safe release, finished-init byte stability, deterministic finish exclusion of mutation/init/resume, and failed Windows replacement preserving previous bytes. Workspace-wide cargo fmt --check remains blocked by unrelated pre-existing formatting drift outside session-api."
