imports:
- 20-readme-schemas.yaml

defaults:
  repo_scope: memory-api
folders:
- name: tools
  folders:
  - name: mcp
    folders:
    - name: rule-mcp
      files:
      - name: README.md
        target:
          name: rule-mcp-readme
          path_scope: tools/mcp/rule-mcp/README.md
          schema: tool-readme-v1
          node_mode: append
          nodes:
          - name: onboarding
            section: tools/mcp/rule-mcp/readme
    - name: spec-mcp
      files:
      - name: README.md
        target:
          name: spec-mcp-readme
          path_scope: tools/mcp/spec-mcp/README.md
          schema: tool-readme-v1
          node_mode: append
          nodes:
          - name: onboarding
            section: tools/mcp/spec-mcp/readme
    - name: ticket-mcp
      files:
      - name: README.md
        target:
          name: ticket-mcp-readme
          path_scope: tools/mcp/ticket-mcp/README.md
          schema: tool-readme-v1
          node_mode: append
          nodes:
          - name: onboarding
            section: tools/mcp/ticket-mcp/readme
    - name: audit-mcp
      files:
      - name: README.md
        target:
          name: audit-mcp-readme
          path_scope: tools/mcp/audit-mcp/README.md
          schema: tool-readme-v1
          node_mode: append
          nodes:
          - name: onboarding
            section: tools/mcp/audit-mcp/readme
