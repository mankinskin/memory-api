imports:
- 20-readme-schemas.yaml

defaults:
  repo_scope: memory-api
folders:
- name: tools
  folders:
  - name: cli
    folders:
    - name: rule-cli
      files:
      - name: README.md
        target:
          name: rule-cli-readme
          path_scope: tools/cli/rule-cli/README.md
          schema: tool-readme-v1
          node_mode: append
          nodes:
          - name: onboarding
            section: tools/cli/rule-cli/readme
    - name: spec-cli
      files:
      - name: README.md
        target:
          name: spec-cli-readme
          path_scope: tools/cli/spec-cli/README.md
          schema: tool-readme-v1
          node_mode: append
          nodes:
          - name: onboarding
            section: tools/cli/spec-cli/readme
    - name: ticket-cli
      files:
      - name: README.md
        target:
          name: ticket-cli-readme
          path_scope: tools/cli/ticket-cli/README.md
          schema: tool-readme-v1
          node_mode: append
          nodes:
          - name: onboarding
            section: tools/cli/ticket-cli/readme
    - name: audit-cli
      files:
      - name: README.md
        target:
          name: audit-cli-readme
          path_scope: tools/cli/audit-cli/README.md
          schema: tool-readme-v1
          node_mode: append
          nodes:
          - name: onboarding
            section: tools/cli/audit-cli/readme
