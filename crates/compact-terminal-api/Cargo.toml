[package]
name = "compact-terminal-api"
version = "0.1.0"
edition = "2024"
description = "Shared compact terminal execution API for compact-terminal transports"

[lib]
name = "compact_terminal_api"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
