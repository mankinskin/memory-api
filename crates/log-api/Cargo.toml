[package]
name = "log-api"
version = "0.1.0"
edition = "2024"
description = "Validation log capture and retrieval identities for spec fulfillment"

[lib]
name = "log_api"
path = "src/lib.rs"

[dependencies]
memory-kernel = { git = "https://github.com/mankinskin/memory-kernel", branch = "main" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
test-api = { path = "../test-api" }

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"