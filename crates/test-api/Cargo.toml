[package]
name = "test-api"
version = "0.1.0"
edition = "2024"
description = "Validation specification and execution identities for spec fulfillment"

[lib]
name = "test_api"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
pretty_assertions = "1"