[package]
name = "test-api"
version = "0.1.0"
edition = "2024"
description = "Validation specification and execution identities for spec fulfillment"

[lib]
name = "test_api"
path = "src/lib.rs"

[dependencies]
memory-kernel = { git = "https://github.com/mankinskin/memory-kernel", branch = "main" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toon-format = "0.5"
thiserror = "2"

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"