[package]
name = "feedback-api"
version = "0.1.0"
edition = "2024"
description = "Feedback system: normalized feedback events, summaries, and file-backed persistence"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3"
