[package]
name = "memory-matrix"
version = "0.1.0"
edition = "2024"
description = "Data-driven cross-domain operation test matrix (get/search/CRUD/move/scan x all memory domains) recording test-api validation executions"

[lib]
name = "memory_matrix"
path = "src/lib.rs"

[[bin]]
name = "bench-matrix"
path = "src/bin/bench-matrix.rs"

[[bench]]
name = "operation_matrix"
harness = false

[dependencies]
memory-fixtures = { git = "https://github.com/mankinskin/memory-fixtures", branch = "main" }
memory-kernel = { git = "https://github.com/mankinskin/memory-kernel", branch = "main"  }
ticket-api = { path = "../ticket-api" }
spec-api = { path = "../spec-api" }
rule-api = { path = "../rule-api" }
audit-api = { path = "../audit-api" }
session-api = { path = "../session-api" }
test-api = { path = "../test-api" }
log-api = { path = "../log-api" }
ticket = { path = "../ticket", features = ["cli", "mcp", "http"] }
spec-cli = { path = "../../tools/cli/spec-cli" }
rule-cli = { path = "../../tools/cli/rule-cli" }
spec-mcp = { path = "../../tools/mcp/spec-mcp" }
rule-mcp = { path = "../../tools/mcp/rule-mcp" }
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
rmcp = { version = "0.14", features = ["server", "transport-io"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
pretty_assertions = "1"
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

