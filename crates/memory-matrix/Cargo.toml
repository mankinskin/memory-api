[package]
name = "memory-matrix"
version = "0.1.0"
edition = "2024"
description = "Data-driven cross-domain operation test matrix (get/search/CRUD/move/scan x all memory domains) recording test-api validation executions"

[lib]
name = "memory_matrix"
path = "src/lib.rs"

[[bin]]
name = "bench-matrix"
path = "src/bin/bench-matrix.rs"

[[bench]]
name = "operation_matrix"
harness = false

[dependencies]
memory-fixtures = { git = "https://github.com/mankinskin/memory-fixtures", branch = "main" }
memory-kernel = { git = "https://github.com/mankinskin/memory-kernel", branch = "main"  }
ticket-api = { git = "https://github.com/mankinskin/ticket", branch = "main" }
ticket = { git = "https://github.com/mankinskin/ticket", branch = "main", features = ["cli", "mcp", "http"] }
spec-api = { git = "https://github.com/mankinskin/spec", branch = "main" }
spec = { git = "https://github.com/mankinskin/spec", branch = "main", features = ["cli", "mcp", "http"] }
rule-api = { git = "https://github.com/mankinskin/rule", branch = "main" }
audit-api = { path = "../audit-api" }
session-api = { git = "https://github.com/mankinskin/session", branch = "main" }
test-api = { path = "../test-api" }
log-api = { path = "../log-api" }
rule = { git = "https://github.com/mankinskin/rule", branch = "main", features = ["cli", "mcp"] }
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
rmcp = { version = "0.14", features = ["server", "transport-io"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
pretty_assertions = "1"
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

