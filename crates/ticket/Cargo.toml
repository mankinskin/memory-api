[package]
name = "ticket"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[features]
default = []
cli = ["dep:chrono", "dep:clap", "dep:memory-kernel", "dep:serde", "dep:serde_json", "dep:shell-words", "dep:spec-api", "dep:thiserror", "dep:tokio", "dep:toon-format", "dep:tracing", "dep:uuid"]
mcp = ["dep:chrono", "dep:memory-kernel", "dep:rmcp", "dep:serde", "dep:serde_json", "dep:tokio", "dep:tracing", "dep:uuid"]
http = ["dep:arc-swap", "dep:axum", "dep:chrono", "dep:futures-util", "dep:memory-kernel", "dep:serde", "dep:serde_json", "dep:thiserror", "dep:tokio", "dep:tracing", "dep:uuid"]

[[bin]]
name = "ticket"
path = "src/bin/ticket-cli.rs"
required-features = ["cli"]

[[bin]]
name = "ticket-mcp"
path = "src/bin/ticket-mcp.rs"
required-features = ["mcp"]

[[bin]]
name = "ticket-http"
path = "src/bin/ticket-http.rs"
required-features = ["http"]

[dependencies]
ticket-api = { path = "../ticket-api" }
spec-api = { path = "../spec-api", optional = true }
arc-swap = { version = "1", optional = true }
axum = { version = "0.8", features = ["macros"], optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
clap = { version = "4", features = ["derive"], optional = true }
futures-util = { version = "0.3", optional = true }
memory-kernel = { git = "https://github.com/mankinskin/memory-kernel", branch = "main", optional = true   }
rmcp = { version = "0.14", features = ["server", "transport-io"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
shell-words = { version = "1", optional = true }
thiserror = { version = "2", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
toon-format = { version = "0.5", optional = true }
tracing = { version = "0.1", optional = true }
uuid = { version = "1", features = ["serde", "v4"], optional = true }

[dev-dependencies]
memory-fixtures = { git = "https://github.com/mankinskin/memory-fixtures", branch = "main" }
memory-kernel = { git = "https://github.com/mankinskin/memory-kernel", branch = "main", features = ["testing"]   }
transport-harness = { git = "https://github.com/mankinskin/memory-kernel", branch = "main", features = ["cli", "mcp", "http"]  }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
pretty_assertions = "1"
tempfile = "3"
toml = "0.9"
trybuild = "1"
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }
