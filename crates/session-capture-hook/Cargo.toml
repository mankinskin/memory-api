[package]
name = "session-capture-hook"
version = "0.1.0"
edition = "2024"
description = "Copilot session capture hook binary"

[[bin]]
name = "session-capture-hook"
path = "src/main.rs"

[dependencies]
memory-kernel = { git = "https://github.com/mankinskin/memory-kernel", branch = "main"  }
serde_json = "1"
session-api = { path = "../session-api" }
session-worktree-provision = { path = "../session-worktree-provision" }
session-workspace-resolver = { path = "../session-workspace-resolver" }
ticket-api = { path = "../ticket-api" }

[dev-dependencies]
tempfile = "3"