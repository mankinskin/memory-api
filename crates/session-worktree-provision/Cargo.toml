[package]
name = "session-worktree-provision"
version = "0.1.0"
edition = "2024"
description = "Git access layer for per-session worktree provisioning"

[lib]
name = "session_worktree_provision"
path = "src/lib.rs"

[dependencies]
git2 = "0.20"
serde_json = "1"
spec-api = { path = "../spec-api" }
thiserror = "2"
ticket-api = { path = "../ticket-api" }
time = { version = "0.3", features = ["formatting", "parsing"] }

[dev-dependencies]
tempfile = "3"