[package]
name = "memory-fixtures"
version = "0.1.0"
edition = "2024"
description = "Shared E2E fixture loader for multi-store and multi-worktree memory tests"

[lib]
name = "memory_fixtures"
path = "src/lib.rs"

[[bin]]
name = "startup-matrix"
path = "src/bin/startup-matrix.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
tempfile = "3"
toon-format = "0.5"
