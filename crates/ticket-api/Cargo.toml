[package]
name = "ticket-api"
version = "0.1.0"
edition = "2024"
description = "Core ticket library: domain types, storage, query, and workspace management"

[dependencies]
memory-kernel = { git = "https://github.com/mankinskin/memory-kernel", branch = "main"  }
feedback-api = { path = "../feedback-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
thiserror = "2"
notify = "6"
fs4 = "0.11"
rusqlite = { version = "0.32", features = ["bundled", "unlock_notify"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
url = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
pretty_assertions = "1"
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"
chrono = { version = "0.4" }
memory-fixtures = { git = "https://github.com/mankinskin/memory-fixtures", branch = "main" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bench]]
name = "graph_ops"
harness = false

[[bench]]
name = "fixture_scan"
harness = false

[[bench]]
name = "move_health"
harness = false
