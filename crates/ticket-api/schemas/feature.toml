# Ticket type schema for "feature"
#
# Used for feature development tickets in the tool-metrics / graded budget
# feature set. Edit or copy this file to define custom ticket types; load
# custom schemas with `ticket --schema-dir <dir>`.

type_id = "feature"

states = [
    "new",
    "ready",
    "in-implementation",
    "in-review",
    "on-hold",
    "done",
    "cancelled",
]

# States that must appear in a ticket's history before it can reach a terminal
# state (done). This enforces that every ticket passes through review.
required_states = ["in-review"]

# ── State machine transitions ──────────────────────────────────────────────────

[[transitions]]
from = "new"
to = "ready"

[[transitions]]
from = "new"
to = "in-review"

[[transitions]]
from = "new"
to = "cancelled"

[[transitions]]
from = "ready"
to = "in-implementation"

[[transitions]]
from = "ready"
to = "cancelled"

[[transitions]]
from = "ready"
to = "on-hold"

[[transitions]]
from = "in-implementation"
to = "in-review"

[[transitions]]
from = "in-implementation"
to = "cancelled"

[[transitions]]
from = "in-implementation"
to = "on-hold"

[[transitions]]
from = "in-review"
to = "done"

[[transitions]]
from = "in-review"
to = "cancelled"

[[transitions]]
from = "in-review"
to = "on-hold"

[[transitions]]
from = "on-hold"
to = "ready"

[[transitions]]
from = "on-hold"
to = "cancelled"

# ── Field definitions ──────────────────────────────────────────────────────────
# Required fields must be present in every manifest of this type.
# Optional fields are indexed when present.

[fields.title]
field_type = "string"
required = true

[fields.component]
field_type = "string"
required = false

[fields.risk_level]
field_type = "string"
required = false
