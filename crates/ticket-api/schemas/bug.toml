# Ticket type schema for "bug"
#
# Mirrors the core implementation workflow while preserving a dedicated bug
# type for triage and state transitions.

type_id = "bug"

states = [
    "open",
    "planned",
    "in-implementation",
    "in-review",
    "on-hold",
    "done",
    "cancelled",
]

required_states = ["in-review"]

[[transitions]]
from = "open"
to = "planned"

[[transitions]]
from = "open"
to = "cancelled"

[[transitions]]
from = "planned"
to = "in-implementation"

[[transitions]]
from = "planned"
to = "cancelled"

[[transitions]]
from = "planned"
to = "on-hold"

[[transitions]]
from = "in-implementation"
to = "in-review"

[[transitions]]
from = "in-implementation"
to = "cancelled"

[[transitions]]
from = "in-implementation"
to = "on-hold"

[[transitions]]
from = "in-review"
to = "done"

[[transitions]]
from = "in-review"
to = "cancelled"

[[transitions]]
from = "in-review"
to = "on-hold"

[[transitions]]
from = "on-hold"
to = "cancelled"

[fields.title]
field_type = "string"
required = true

[fields.type]
field_type = "string"
required = true

[fields.state]
field_type = "string"
required = false

[fields.component]
field_type = "string"
required = false

[fields.priority]
field_type = "string"
required = false

[fields.effort]
field_type = "string"
required = false

[fields.acceptance_criteria]
field_type = "string"
required = false

[fields.validation_plan]
field_type = "string"
required = false

[fields.validation_status]
field_type = "string"
required = false

[fields.validation_note]
field_type = "string"
required = false

[fields.implementation_note]
field_type = "string"
required = false

[fields.tags]
field_type = "string"
required = false

[edge_rules.depends_on]
directed = true
acyclic_enforced = true

[edge_rules.linked]
directed = false
acyclic_enforced = false