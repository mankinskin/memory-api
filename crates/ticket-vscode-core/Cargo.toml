[package]
name = "ticket-vscode-core"
version = "0.1.0"
edition = "2021"
description = "Rust/WASM core for ticket-vscode: deterministic ticket-domain logic callable from both Node and WebWorker extension hosts"

# Both cdylib (wasm-pack/browser) and rlib (cargo test, native bench) are
# needed so `cargo test` can link and `wasm-pack build` produces the .wasm.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
# When the "wasm" feature is active (wasm-pack sets this via wasm-bindgen)
# the crate exposes #[wasm_bindgen] bindings. Disable for pure-Rust unit tests.
wasm = ["wasm-bindgen", "js-sys"]

[dependencies]
wasm-bindgen = { version = "0.2.115", optional = true }
js-sys = { version = "0.3", optional = true }

[dev-dependencies]
# wasm-bindgen-test is needed for in-browser tests via wasm-pack test.
wasm-bindgen-test = "0.3"
